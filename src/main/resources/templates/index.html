<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center">
                    <h1 class="display-4 mb-4">
                        <i class="fas fa-comments text-primary"></i>
                        Java Chat App
                    </h1>
                    <p class="lead mb-5">Connect with anyone, anytime. Real-time messaging made simple.</p>
                    
                    <div class="feature-cards row g-4 mb-5">
                        <div class="col-md-4">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body text-center">
                                    <i class="fas fa-user-plus fa-2x text-primary mb-3"></i>
                                    <h5 class="card-title">Add Anyone</h5>
                                    <p class="card-text">Search and add any user to start chatting instantly</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body text-center">
                                    <i class="fas fa-bolt fa-2x text-primary mb-3"></i>
                                    <h5 class="card-title">Real-time</h5>
                                    <p class="card-text">Messages delivered instantly with WebSocket technology</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body text-center">
                                    <i class="fas fa-shield-alt fa-2x text-primary mb-3"></i>
                                    <h5 class="card-title">Secure</h5>
                                    <p class="card-text">Your conversations are protected and private</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="auth-buttons">
                        <a href="/login" class="btn btn-primary btn-lg me-3">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                        <a href="/register" class="btn btn-outline-primary btn-lg">
                            <i class="fas fa-user-plus"></i> Register
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
